[package]
name = "ntz-gui"
version.workspace = true
edition.workspace = true

[dependencies]
ntz-core.workspace = true
ntz-analyzer.workspace = true
eframe = "0.36.2"
raw-window-handle = "0.6"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
rfd = "0.17.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
