[package]
name = "ntz"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"
anyhow = "1.0.104"
tower-http = { version = "0.7.0", features = ["cors"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tracing = "0.1.41"
uuid = { version = "1.11.0", features = ["v7"] }
